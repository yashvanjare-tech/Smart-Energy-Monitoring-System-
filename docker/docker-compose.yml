version: "3.9"

services:
  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mlflow
    container_name: energy-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: energy-api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../ml/artifacts:/app/ml/artifacts
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    depends_on:
      - mlflow
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    container_name: energy-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../ml/artifacts:/app/ml/artifacts
    environment:
      - ENERGY_API_URL=http://api:8000
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mlflow_data:
